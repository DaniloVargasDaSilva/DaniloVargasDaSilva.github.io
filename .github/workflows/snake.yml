# Gera a cobrinha que come o gráfico de contribuições e publica no branch "output".
# Roda todo dia e também pode ser disparado à mão em Actions → Generate snake → Run workflow.
name: Generate snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1F3FBF&color_dots=#ebedf0,#c6d0f5,#8ea4ff,#3f5fd8,#1F3FBF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8EA4FF

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
